[world]
name = "Athanor"
description = "Onchain tactical dungeon crawler — grid-based combat with telegraphed attacks"
seed = "athanor_0_1"

[env]
rpc_url = "https://api.cartridge.gg/x/athanor-djizus-slot/katana"
account_address = "0x127fd5f1fe78a71f8bcd1fec63e3fe2f0486b6ecd5c86a0466c3a21fa5cfcec"
private_key = "0xc5b2fcab997346f3ea1c00b002ecf6f382c5f9c9659a3894eb783c5320f912"

[namespace]
default = "athanor_0_1"

# Grant writer permissions on the namespace so setup::dojo_init can seed
# GameSettings rows and actions can mutate RunState/RoomState/etc. at runtime.
[writers]
"athanor_0_1" = ["athanor_0_1-actions", "athanor_0_1-setup"]

# Slot init: three addresses passed to actions::dojo_init —
#   (denshokan_address, vrf_address, lords_address)
# Denshokan is 0x0 until we wire the real EGC token address.
# VRF is 0x0 (RandomTrait falls back to tx_hash-based pseudo-random).
# LORDS is the deployed mock_lords on Slot — scripts/deploy.sh declares +
# deploys mock_lords, then rewrites this entry before sozo migrate.
[init_call_args]
"athanor_0_1-actions" = ["0x0", "0x0", "0x0"]
