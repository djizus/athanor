[workspace]
members = ["contracts"]

[workspace.package]
edition = "2024_07"
cairo-version = "2.15.0"
authors = ["Provable Games"]
license = "MIT"
repository = "https://github.com/Provable-Games/number-guess"

[workspace.dependencies]
starknet = "2.15.1"
game_components_embeddable_game_standard = { git = "https://github.com/Provable-Games/game-components.git", branch = "next" }
dojo = "1.8.0"
dojo_cairo_macros = "1.8.0"
dojo_cairo_test = "1.8.0"
openzeppelin = { git = "https://github.com/OpenZeppelin/cairo-contracts.git", tag = "v3.0.0" }
snforge_std = { git = "https://github.com/foundry-rs/starknet-foundry", tag = "v0.55.0" }
cairo_test = "2.15.1"

[workspace.tool.fmt]
sort-module-level-items = true

[workspace.tool.snforge]
exit_first = false
fuzzer_runs = 256

[[workspace.tool.snforge.fork]]
name = "MAINNET_LATEST"
url = "https://api.cartridge.gg/x/starknet/mainnet"
block_id.tag = "latest"

[[workspace.tool.snforge.fork]]
name = "SEPOLIA_LATEST"
url = "https://api.cartridge.gg/x/starknet/sepolia"
block_id.tag = "latest"

[profile.slot]
[profile.sepolia]
