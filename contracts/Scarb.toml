[package]
name = "athanor"
version = "0.1.0"
edition.workspace = true
cairo-version.workspace = true

[tool.scarb]
allow-prebuilt-plugins = ["dojo_cairo_macros"]

[scripts]
slot = "sozo --profile slot clean && sozo --profile slot build && sozo --profile slot migrate --guest"

[dependencies]
game_components_embeddable_game_standard.workspace = true
dojo.workspace = true
openzeppelin.workspace = true
starknet.workspace = true

[dev-dependencies]
dojo_cairo_test.workspace = true
cairo_test.workspace = true
snforge_std.workspace = true

[[target.starknet-contract]]
build-external-contracts = ["dojo::world::world_contract::world"]

[features]
default = []
